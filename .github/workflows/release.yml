# Publishing is creating a GitHub release: tag v<version>, write the notes,
# publish — this workflow does the rest. `prepublishOnly` re-runs build,
# lint and the full suite inside `npm publish`, so a release that would
# ship broken never leaves the runner.
#
# Auth is npm trusted publishing (OIDC): npmjs.com is configured to trust
# this repository's release.yml, so no token is minted, stored, or able to
# leak — and npm attests provenance automatically on every publish from a
# public repository. Setup (once, and only after the package first exists
# on the registry): npmjs.com → package → Settings → Trusted Publisher →
# GitHub Actions, with organization den-frie-vilje, repository
# cupertino-files, and workflow filename release.yml — the fields are
# case-sensitive and the filename must match this file's name exactly.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # the OIDC token npm exchanges for a publish credential

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm ≥ 11.5.1; Node's bundled npm can lag.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Tag must match package.json
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "package.json is $PKG but the release tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - run: npm publish
