# Publishing is creating a GitHub release: tag v<version>, write the notes,
# publish — this workflow does the rest. `prepublishOnly` re-runs build,
# lint and the full suite inside `npm publish`, so a release that would
# ship broken never leaves the runner.
#
# Setup (once): add an npm automation token as the NPM_TOKEN repository
# secret. `--provenance` then attests the published tarball to this
# repository and commit — the supply-chain counterpart of the provenance
# discipline everywhere else in this project.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm --provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag must match package.json
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "package.json is $PKG but the release tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
