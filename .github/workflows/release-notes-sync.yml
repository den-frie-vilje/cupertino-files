# Re-derive a published release's notes from CHANGELOG.md.
#
# Actions → Sync release notes → "Run workflow" with a version (e.g.
# 0.4.0): the run regenerates RELEASE_NOTES.md from that version's
# changelog section (scripts/release-notes.ts is idempotent per version)
# and rewrites the GitHub release body to match. Use it after editing a
# released section — the changelog is the source of truth for what a
# release says, and the published page should never say something else.
#
# A version that shipped before this pipeline existed has a changelog
# section but no GitHub release. Passing the commit it was published
# from as `target` creates the tag and then the release on it, the
# sequence the Release workflow uses. The Actions token may push a tag
# only when the tagged commit's workflow files match the default
# branch's (GitHub's "workflows permission" rule), so for an older
# commit push the tag by hand first (git tag -a vX <commit> -m vX &&
# git push origin vX) and dispatch without a target: the run creates
# the release on the existing tag. Either way the release is created
# by the Actions token, whose events never start a workflow, so the
# Release workflow's publish step does not run and npm is untouched;
# --latest=false keeps the newest version's badge where it is.
name: Sync release notes

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version whose notes to sync (e.g. 0.4.0 — no leading v)"
        required: true
      target:
        description: "Commit the version was published from; only to create a release that does not exist yet"
        required: false
        default: ""

permissions:
  contents: write # gh release edit, or create

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Regenerate and apply the notes
        env:
          VERSION: ${{ github.event.inputs.version }}
          TARGET: ${{ github.event.inputs.target }}
          GH_TOKEN: ${{ github.token }}
        # The changelog must already carry the version: the notes script
        # would otherwise cut the Unreleased section under a mistyped
        # version and hand its notes to the wrong release.
        run: |
          grep -qE "^## ${VERSION//./\\.} — " CHANGELOG.md || {
            echo "CHANGELOG.md has no section for $VERSION." >&2
            exit 1
          }
          node --experimental-strip-types scripts/release-notes.ts "$VERSION"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release edit "v$VERSION" --notes-file RELEASE_NOTES.md
          else
            if ! git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
              if [ -z "$TARGET" ]; then
                echo "No GitHub release or tag v$VERSION exists. Pass the commit it was published from as target to create them." >&2
                exit 1
              fi
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git fetch --depth=1 origin "$TARGET"
              git tag -a "v$VERSION" "$TARGET" -m "v$VERSION"
              git push origin "refs/tags/v$VERSION"
            fi
            gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file RELEASE_NOTES.md --latest=false
          fi
